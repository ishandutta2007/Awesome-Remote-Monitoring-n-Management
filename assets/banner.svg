<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0c1527"/>
      <stop offset="100%" stop-color="#080e1b"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="emeraldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Scanline Gradient -->
    <linearGradient id="scanBeam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </linearGradient>

    <!-- Radial Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes scanVertical {
        0% { transform: translateY(-420px); }
        100% { transform: translateY(420px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.95; transform: scale(1.08); }
      }
      @keyframes blinkActive {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 1; }
      }
      @keyframes pingRing {
        0% { r: 12; opacity: 0.85; }
        100% { r: 40; opacity: 0; }
      }
      @keyframes waveFlow {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -140; }
      }
      @keyframes floatBadge {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-5px); }
      }

      .radar-arm {
        transform-origin: 1040px 210px;
        animation: radarSweep 5s linear infinite;
      }
      .scanner-beam {
        animation: scanVertical 4s ease-in-out infinite;
      }
      .pulse-beacon {
        animation: pulseGlow 3s ease-in-out infinite;
      }
      .node-live {
        animation: blinkActive 1.8s ease-in-out infinite;
      }
      .node-live-alt {
        animation: blinkActive 2.4s ease-in-out infinite 0.7s;
      }
      .ping-circle {
        animation: pingRing 2s cubic-bezier(0, 0.2, 0.8, 1) infinite;
        transform-origin: 1040px 210px;
      }
      .ping-circle-2 {
        animation: pingRing 2s cubic-bezier(0, 0.2, 0.8, 1) infinite 1s;
        transform-origin: 1040px 210px;
      }
      .telemetry-wave {
        stroke-dasharray: 8 6;
        animation: waveFlow 4s linear infinite;
      }
      .floating-badge {
        animation: floatBadge 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="14" fill="url(#bgGradient)"/>

  <!-- Subtle Cyber Tech Grid Pattern -->
  <g stroke="#1e293b" stroke-width="0.8" opacity="0.45">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>

    <line x1="80" y1="0" x2="80" y2="420"/>
    <line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="320" y1="0" x2="320" y2="420"/>
    <line x1="440" y1="0" x2="440" y2="420"/>
    <line x1="560" y1="0" x2="560" y2="420"/>
    <line x1="680" y1="0" x2="680" y2="420"/>
    <line x1="800" y1="0" x2="800" y2="420"/>
    <line x1="920" y1="0" x2="920" y2="420"/>
    <line x1="1040" y1="0" x2="1040" y2="420"/>
    <line x1="1160" y1="0" x2="1160" y2="420"/>
  </g>

  <!-- Ambient Glow Blobs -->
  <circle cx="200" cy="120" r="160" fill="#38bdf8" opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="650" cy="220" r="190" fill="#6366f1" opacity="0.08" filter="url(#softGlow)"/>
  <circle cx="1040" cy="210" r="140" fill="#10b981" opacity="0.10" filter="url(#softGlow)"/>

  <!-- Scanning Beam Effect across entire banner -->
  <rect class="scanner-beam" x="0" y="0" width="1200" height="90" fill="url(#scanBeam)" pointer-events="none"/>

  <!-- Category Tag Pill -->
  <g class="floating-badge" transform="translate(80, 50)">
    <rect x="0" y="0" width="310" height="34" rx="17" fill="#0f172a" stroke="#00f2fe" stroke-width="1.2" opacity="0.95"/>
    <circle cx="18" cy="17" r="5" fill="#00f2fe" class="node-live"/>
    <text x="32" y="22" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="1.2">CURATED IT &amp; MSP ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="80" y="145" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
    Remote Monitoring &amp; Management
  </text>
  <text x="80" y="195" fill="url(#cyanGlow)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" filter="url(#glow)">
    (RMM) Awesome Directory 🚀
  </text>

  <!-- Subtitle / Tagline -->
  <text x="80" y="240" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" font-weight="400">
    The ultimate curated index of enterprise SaaS platforms, open-source agents &amp; MSP toolsets.
  </text>

  <!-- Feature Highlights / Pills -->
  <g transform="translate(80, 275)">
    <rect x="0" y="0" width="168" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="16" cy="17" r="4" fill="#10b981" class="node-live"/>
    <text x="28" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ Automated Patching</text>

    <rect x="180" y="0" width="165" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="196" cy="17" r="4" fill="#38bdf8" class="node-live-alt"/>
    <text x="208" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📡 Remote Telemetry</text>

    <rect x="357" y="0" width="168" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="373" cy="17" r="4" fill="#a855f7"/>
    <text x="385" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">💻 Win • Mac • Linux</text>

    <rect x="537" y="0" width="165" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="553" cy="17" r="4" fill="#f59e0b" class="node-live"/>
    <text x="565" y="21" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🛡️ Self-Host &amp; Cloud</text>
  </g>

  <!-- Telemetry Waveform -->
  <g transform="translate(80, 340)">
    <path class="telemetry-wave" d="M0,25 L120,25 L140,8 L155,38 L170,14 L185,25 L350,25 L370,5 L385,42 L400,10 L415,25 L650,25" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.85"/>
    <circle cx="650" cy="25" r="4" fill="#00f2fe" class="node-live"/>
    <text x="665" y="29" fill="#64748b" font-family="monospace" font-size="11">FLEET TELEMETRY: 99.98% HEALTHY</text>
  </g>

  <!-- Right Side Interactive RMM Radar & Fleet Visualizer -->
  <g transform="translate(0, 0)">
    <circle cx="1040" cy="210" r="130" fill="none" stroke="#1e293b" stroke-width="1"/>
    <circle cx="1040" cy="210" r="95" fill="none" stroke="#1e293b" stroke-width="1"/>
    <circle cx="1040" cy="210" r="60" fill="none" stroke="#1e293b" stroke-width="1"/>
    <circle cx="1040" cy="210" r="25" fill="#0f172a" stroke="#00f2fe" stroke-width="1.5"/>

    <line x1="910" y1="210" x2="1170" y2="210" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="1040" y1="80" x2="1040" y2="340" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>

    <circle class="ping-circle" cx="1040" cy="210" r="10" fill="none" stroke="#00f2fe" stroke-width="1.8"/>
    <circle class="ping-circle-2" cx="1040" cy="210" r="10" fill="none" stroke="#10b981" stroke-width="1.8"/>

    <g class="radar-arm">
      <line x1="1040" y1="210" x2="1170" y2="210" stroke="#00f2fe" stroke-width="2.5" filter="url(#glow)"/>
      <path d="M1040,210 L1160,165 A130,130 0 0,1 1170,210 Z" fill="url(#cyanGlow)" opacity="0.25"/>
    </g>

    <circle cx="980" cy="160" r="6" fill="#10b981" class="node-live" filter="url(#glow)"/>
    <text x="965" y="148" fill="#a7f3d0" font-family="monospace" font-size="10">SRV-01 [OK]</text>

    <circle cx="1090" cy="140" r="5" fill="#38bdf8" class="node-live-alt" filter="url(#glow)"/>
    <text x="1098" y="138" fill="#bae6fd" font-family="monospace" font-size="10">K8S-NODE</text>

    <circle cx="1110" cy="265" r="5" fill="#10b981" class="node-live"/>
    <text x="1100" y="285" fill="#a7f3d0" font-family="monospace" font-size="10">MAC-DEV</text>

    <circle cx="970" cy="270" r="6" fill="#f59e0b" class="node-live-alt"/>
    <text x="925" y="286" fill="#fde68a" font-family="monospace" font-size="10">PATCH PENDING</text>

    <circle cx="1040" cy="210" r="4" fill="#00f2fe" filter="url(#glow)"/>
  </g>

  <!-- Border Frame Accent -->
  <rect x="1" y="1" width="1198" height="418" rx="12" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
</svg>
